name = "Point source"
description = "A source that sends a fan of rays at the black hole every 1.5 s"

[[emitter]]
type = "cone"
pos = [-7.6, 5.1]
aim = [0, 0]            # the fan is centered on this point; use angle = <rad> instead to set a direction
spread = 1.0471976      # fan width, rad (60 degrees)
rays = 25
start = "0s"
cooldown = "1.5s"       # between volleys ("500ms" also works); remove the line for a single volley
style = "lime"
